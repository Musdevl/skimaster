name: E2E Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  e2e-scenarios:
    runs-on: self-hosted
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Backend
        run: docker compose up --build -d

      - name: Wait for Backend Readiness
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:8080/health; do sleep 2; done'
        continue-on-error: true

      - name: Install Socat
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Setup Network Bridge (Socat)
        run: socat TCP-LISTEN:80,fork,reuseaddr TCP:localhost:8080 &

      - name: Run CLI Scenarios
        working-directory: cli/demo
        run: |
          chmod +x all-scenarios.sh
          ./all-scenarios.sh

      - name: Cleanup
        if: always()
        run: docker compose down