    pull_policy: never
    container_name: gate2
    ports:
      - "8091:8090"
    environment:
      - BACKEND=backend:8080
      - POSTGRES_HOST=postgres:5432
      - GATE_NAME=gate2
      - GATE_URL=http://gate2:8090
    restart: always
    depends_on:
      gate1:
        condition: service_healthy
      postgres:
        condition: service_healthy
